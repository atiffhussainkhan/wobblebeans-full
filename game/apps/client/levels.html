<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wobblebeans levels</title>
    <style>
      html, body { margin: 0; height: 100%; background: #bfe6ff; color: #1f2140; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar {
        position: fixed; left: 16px; right: 16px; top: 16px;
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: #fffdf7; border: 4px solid #1f2140; border-radius: 16px;
        padding: 10px 14px; box-shadow: 0 6px 0 rgba(31, 33, 64, 0.12);
      }
      #title { font-size: 22px; margin: 0 8px 0 0; }
      #card { margin: 0; font-size: 18px; }
      nav { display: flex; flex-wrap: wrap; gap: 6px; }
      a {
        color: #1f2140; background: #ff7a1a; text-decoration: none; font-weight: 700;
        border-radius: 999px; padding: 6px 10px; border: 3px solid #1f2140;
      }
      a[aria-current="true"] { background: #22c3e6; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar">
      <h1 id="title">Level</h1>
      <p id="card"></p>
      <nav aria-label="Levels">
        <a href="/levels.html?level=knock_knock_run">Knock-Knock Run</a>
        <a href="/levels.html?level=bumpy_parade">Bumpy Parade</a>
        <a href="/levels.html?level=slime_rise">Slime Rise</a>
        <a href="/levels.html?level=beam_hop">Beam Hop</a>
        <a href="/levels.html?level=wall_dodge">Wall Dodge</a>
        <a href="/levels.html?level=tail_chase">Tail Chase</a>
        <a href="/levels.html?level=tile_drop">Tile Drop</a>
        <a href="/levels.html?level=summit_grab">Summit Grab</a>
      </nav>
    </div>
    <script type="module" src="/src/preview.ts"></script>
    <script>
      const current = new URLSearchParams(location.search).get('level') || 'knock_knock_run'
      for (const link of document.querySelectorAll('nav a')) {
        if (link.getAttribute('href').endsWith(current)) link.setAttribute('aria-current', 'true')
      }
    </script>
  </body>
</html>
