# Production-shaped local pair. The browser talks to the show server on the host port.
services:
  server:
    build:
      context: ../../..
      dockerfile: tools/qa/docker/Dockerfile.server
      args:
        CLIENT_VERSION: "0.1.0"
        PROTOCOL: "1"
    image: wobblebeans-server:0.1.0-protocol-1
    ports:
      - "47221:47221"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47221/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ../../..
      dockerfile: tools/qa/docker/Dockerfile.client
      args:
        CLIENT_VERSION: "0.1.0"
        PROTOCOL: "1"
        VITE_SERVER_URL: ws://127.0.0.1:47221
    image: wobblebeans-client:0.1.0-protocol-1
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
